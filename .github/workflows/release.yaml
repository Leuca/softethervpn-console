name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    name: Build release bundles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            gateway/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix gateway

      - name: Check release version
        id: version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          [[ "$tag_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          for manifest in \
            package.json \
            package-lock.json \
            gateway/package.json \
            gateway/package-lock.json
          do
            package_version="$(node -p "require('./$manifest').version")"
            if [ "$package_version" != "$tag_version" ]; then
              echo "Tag $GITHUB_REF_NAME does not match $manifest version $package_version" >&2
              exit 1
            fi
          done
          printf 'notes=RELEASE_NOTES_%s.md\n' "${tag_version%%-*}" >> "$GITHUB_OUTPUT"

      - name: Run checks
        run: npm run ci-checks

      - name: Build and package integrated release bundle
        run: |
          npm run build:integrated:release
          artifact="softethervpn-console-${GITHUB_REF_NAME}.tar.gz"
          tar -czf "$artifact" -C dist .
          sha256sum "$artifact" > "$artifact.sha256"

      - name: Build and package managed release bundle
        run: |
          npm run build:managed
          npm --prefix gateway run build
          artifact="softethervpn-console-managed-${GITHUB_REF_NAME}.tar.gz"
          tar -czf "$artifact" \
            dist \
            gateway/dist \
            gateway/package.json \
            gateway/package-lock.json \
            gateway/README.md
          sha256sum "$artifact" > "$artifact.sha256"

      - name: Stage release bundles and optional notes
        uses: actions/upload-artifact@v6
        with:
          name: release-bundles
          if-no-files-found: error
          path: |
            softethervpn-console-${{ github.ref_name }}.tar.gz
            softethervpn-console-${{ github.ref_name }}.tar.gz.sha256
            softethervpn-console-managed-${{ github.ref_name }}.tar.gz
            softethervpn-console-managed-${{ github.ref_name }}.tar.gz.sha256
            ${{ steps.version.outputs.notes }}

  srpm:
    name: Build source RPM
    needs: release
    runs-on: ubuntu-latest
    container: fedora:latest
    outputs:
      filename: ${{ steps.build.outputs.filename }}
    steps:
      - name: Install Fedora packaging tools
        run: >-
          dnf install -y
          git-core
          nodejs-packaging-bundler
          rpm-build
          rpmlint
          systemd-rpm-macros

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build source RPM
        id: build
        shell: bash
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          packaging/build-srpm.sh "$version" srpm "${GITHUB_SHA:?}"
          filename="softethervpn-console-${version/-/.}-1$(rpm --eval '%{?dist}').src.rpm"
          printf 'filename=%s\n' "$filename" >> "$GITHUB_OUTPUT"

      - name: Stage source RPM
        uses: actions/upload-artifact@v6
        with:
          name: release-srpm
          if-no-files-found: error
          path: |
            srpm/${{ steps.build.outputs.filename }}
            srpm/${{ steps.build.outputs.filename }}.sha256

  publish:
    name: Publish release
    needs: [release, srpm]
    runs-on: ubuntu-latest
    concurrency:
      group: release-publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Download release bundles and notes
        uses: actions/download-artifact@v7
        with:
          name: release-bundles
          path: ${{ runner.temp }}/release-bundles

      - name: Download source RPM
        uses: actions/download-artifact@v7
        with:
          name: release-srpm
          path: ${{ runner.temp }}/release-srpm

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SRPM_NAME: ${{ needs.srpm.outputs.filename }}
          IMMUTABLE_RELEASES_CONFIRMED: ${{ vars.IMMUTABLE_RELEASES_CONFIRMED }}
        run: |
          if [[ "$IMMUTABLE_RELEASES_CONFIRMED" != true ]]; then
            echo "Repository immutable releases must be enabled and confirmed (docs/VERSIONING.md)." >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$SRPM_NAME" =~ ^"softethervpn-console-${version/-/.}-1"(\.fc[0-9]+)?\.src\.rpm$ ]]
          bundles="$RUNNER_TEMP/release-bundles"
          assets=()
          for path in \
            "$bundles/softethervpn-console-${GITHUB_REF_NAME}.tar.gz" \
            "$bundles/softethervpn-console-managed-${GITHUB_REF_NAME}.tar.gz" \
            "$RUNNER_TEMP/release-srpm/$SRPM_NAME"
          do
            [[ -f "$path" && ! -L "$path" && -f "$path.sha256" && ! -L "$path.sha256" ]]
            # Compare bytes so the sidecar cannot select a file for the publisher to read.
            (cd "${path%/*}" && sha256sum -- "${path##*/}") | cmp - "$path.sha256"
            assets+=("$path" "$path.sha256")
          done

          expected='{}'
          for path in "${assets[@]}"; do
            digest="$(sha256sum -- "$path")"
            expected="$(jq -c --arg name "${path##*/}" --arg digest "sha256:${digest%% *}" \
              '.[$name] = $digest' <<< "$expected")"
          done

          # A successful listing includes drafts for this writer. A failed lookup is never absence.
          releases="repos/$GH_REPO/releases"
          lookup_draft() {
            gh api --paginate --slurp "$releases?per_page=100" | jq -er --arg tag "$GITHUB_REF_NAME" '
              if length == 0 or any(.[]; type != "array") or any(.[][]; (.tag_name | type) != "string")
              then error("invalid release listing") end |
              map(.[]) | map(select(.tag_name == $tag)) |
              if length == 0 then "missing"
              elif length == 1 and .[0].draft == true then .[0].id | numbers
              else error("published or ambiguous release for " + $tag) end'
          }
          id="$(lookup_draft)"
          prerelease=false
          if [[ "$version" == *-* ]]; then prerelease=true; fi
          if [[ "$id" == missing ]]; then
            release_notes="$bundles/RELEASE_NOTES_${version%%-*}.md"
            [[ ! -L "$release_notes" ]]
            notes_option=(-F generate_release_notes=true)
            if [[ -f "$release_notes" ]]; then
              notes_option=(-F "body=@$release_notes")
            fi
            gh api "repos/$GH_REPO/git/ref/tags/$GITHUB_REF_NAME" --silent
            id="$(gh api "$releases" -f tag_name="$GITHUB_REF_NAME" -F draft=true \
              -F prerelease="$prerelease" -f name="SoftEther VPN Console $GITHUB_REF_NAME" \
              "${notes_option[@]}" | jq -er '.id')"
            current="$(lookup_draft)"
            [[ "$current" == "$id" ]]
          fi
          [[ "$id" =~ ^[1-9][0-9]*$ ]]

          draft_assets() {
            gh api "$releases/$id" | jq -ce --arg tag "$GITHUB_REF_NAME" --argjson expected "$expected" '
              if .draft != true or .tag_name != $tag or (.assets | type) != "array"
              then error("not the expected draft") end |
              reduce .assets[] as $a ({};
                if has($a.name) or ($expected | has($a.name) | not) or
                   $a.state != "uploaded" or $a.digest != $expected[$a.name]
                then error("unexpected or mismatched asset: " + $a.name)
                else .[$a.name] = $a.digest end)'
          }

          for path in "${assets[@]}"; do
            present="$(draft_assets)"
            name="${path##*/}"
            exists="$(jq --arg name "$name" 'has($name)' <<< "$present")"
            if [[ "$exists" == true ]]; then continue; fi
            [[ "$exists" == false ]]
            # Names are allowlisted above. A concurrent duplicate POST must fail, never replace.
            gh api --method POST "https://uploads.github.com/$releases/$id/assets?name=$name" \
              -H 'Content-Type: application/octet-stream' --input "$path" --silent
          done
          current="$(lookup_draft)"
          [[ "$current" == "$id" ]]
          present="$(draft_assets)"
          jq -e --argjson expected "$expected" '. == $expected' <<< "$present" > /dev/null
          gh api --method PATCH "$releases/$id" -F draft=false -F prerelease="$prerelease" --silent
