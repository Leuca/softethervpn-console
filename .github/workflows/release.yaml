name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build release bundles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            gateway/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix gateway

      - name: Check release version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          for manifest in \
            package.json \
            package-lock.json \
            gateway/package.json \
            gateway/package-lock.json
          do
            package_version="$(node -p "require('./$manifest').version")"
            if [ "$package_version" != "$tag_version" ]; then
              echo "Tag $GITHUB_REF_NAME does not match $manifest version $package_version" >&2
              exit 1
            fi
          done

      - name: Run checks
        run: npm run ci-checks

      - name: Build and package integrated release bundle
        run: |
          npm run build:integrated
          artifact="softethervpn-console-${GITHUB_REF_NAME}.tar.gz"
          tar -czf "$artifact" -C dist .
          sha256sum "$artifact" > "$artifact.sha256"

      - name: Build and package managed release bundle
        run: |
          npm run build:managed
          npm --prefix gateway run build
          artifact="softethervpn-console-managed-${GITHUB_REF_NAME}.tar.gz"
          tar -czf "$artifact" \
            dist \
            gateway/dist \
            gateway/package.json \
            gateway/package-lock.json \
            gateway/README.md
          sha256sum "$artifact" > "$artifact.sha256"

      - name: Upload bundles to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact="softethervpn-console-${GITHUB_REF_NAME}.tar.gz"
          managed_artifact="softethervpn-console-managed-${GITHUB_REF_NAME}.tar.gz"
          sha256sum --check "$artifact.sha256" "$managed_artifact.sha256"

          if release_is_draft="$(
            gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null
          )"; then
            if [[ "$release_is_draft" != true ]]; then
              echo "Release $GITHUB_REF_NAME is already published; refusing to replace its assets." >&2
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --generate-notes \
              --title "SoftEther VPN Console $GITHUB_REF_NAME" \
              --verify-tag
          fi

          gh release upload "$GITHUB_REF_NAME" \
            --clobber \
            "$artifact" \
            "$artifact.sha256" \
            "$managed_artifact" \
            "$managed_artifact.sha256"

  srpm:
    name: Build source RPM
    needs: release
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Fedora packaging tools
        run: >-
          dnf install -y
          gh
          git-core
          nodejs-packaging-bundler
          rpm-build
          rpmlint
          systemd-rpm-macros

      - name: Build source RPM
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          packaging/build-srpm.sh "${GITHUB_REF_NAME#v}" "$RUNNER_TEMP/srpm"

      - name: Upload source RPM to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (
            cd "$RUNNER_TEMP/srpm"
            sha256sum --check -- *.sha256
          )
          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            "$RUNNER_TEMP"/srpm/*

  publish:
    name: Publish release
    needs: srpm
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=false
          if [[ "${GITHUB_REF_NAME#v}" == *-* ]]; then
            prerelease=true
          fi
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --prerelease="$prerelease"
